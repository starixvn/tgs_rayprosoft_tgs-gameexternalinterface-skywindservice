apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameexternalinterface-sw-service.fullname" . }}
  labels:
    {{- include "game-gameexternalinterface-sw-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameExternalInterfaceSettings": {
         "GameProviderCode": "SWTF",
         "GameProviderCode": "SWTFConfiguration"
      },
      "GameExternalInterface": {
        "GameProvidersQueryServerClientBaseUrl": "http://game-gameprovider-queryserver/",
        "GameTokenClientBaseUrl": "http://game-token/"
        }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
